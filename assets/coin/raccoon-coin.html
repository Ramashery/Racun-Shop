const scene = new THREE.Scene();
// прозрачный фон — коинку встраиваем поверх фона сайта, не поверх чёрного
// прямоугольника
scene.background = null;

const camera = new THREE.PerspectiveCamera(36, stage.clientWidth / stage.clientHeight, 0.1, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
stage.appendChild(renderer.domElement);

const COIN_R = 2;
const FRAME_MARGIN = 1.35;

function fitCamera() {
  const aspect = stage.clientWidth / stage.clientHeight;
  camera.aspect = aspect;
  const vFov = camera.fov * Math.PI / 180;
  const target = COIN_R * FRAME_MARGIN;

  let dist = target / Math.tan(vFov / 2);
  if (aspect < 1) {
    const neededDist = target / (Math.tan(vFov / 2) * aspect);
    dist = Math.max(dist, neededDist);
  }

  // camera sits level, looking straight at the coin's face
  camera.position.set(0, 0, dist);
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
}
fitCamera();

scene.add(new THREE.HemisphereLight(0xa8b4ff, 0x0a0a18, 0.85));

const lightRig = new THREE.Group();
scene.add(lightRig);

const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(2.5, 4, 4);
lightRig.add(key);

const front = new THREE.PointLight(0xd8dcff, 1.6, 30);
front.position.set(0, 1, 6);
lightRig.add(front);

const rimL = new THREE.PointLight(0x8a7bff, 2.4, 30);
rimL.position.set(-4, 1.5, -3);
lightRig.add(rimL);

const rimR = new THREE.PointLight(0x7ba0ff, 1.8, 30);
rimR.position.set(4, -1, -3);
lightRig.add(rimR);

const back = new THREE.PointLight(0x9fc4ff, 1.2, 30);
back.position.set(0, -2, -5);
lightRig.add(back);

function buildEnvTexture() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 128);
  g.addColorStop(0, '#6a6adf');
  g.addColorStop(0.35, '#201f4d');
  g.addColorStop(0.75, '#0a0a1c');
  g.addColorStop(1, '#020204');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 128);
  const g2 = ctx.createRadialGradient(128, 24, 5, 128, 24, 160);
  g2.addColorStop(0, 'rgba(220,220,255,1)');
  g2.addColorStop(1, 'rgba(220,220,255,0)');
  ctx.fillStyle = g2;
  ctx.fillRect(0, 0, 256, 128);
  const g3 = ctx.createRadialGradient(40, 90, 4, 40, 90, 90);
  g3.addColorStop(0, 'rgba(150,140,255,0.8)');
  g3.addColorStop(1, 'rgba(150,140,255,0)');
  ctx.fillStyle = g3;
  ctx.fillRect(0, 0, 256, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}
scene.environment = buildEnvTexture();

// flipGroup rotates around the world Y axis. Because the coin mesh inside
// it is reoriented to face the camera (see mesh.rotation.x below), that
// world Y axis runs through the coin's own rim/edge (its diameter) rather
// than through the center of its round faces — a classic "coin toss" flip
// instead of a record-player spin.
const flipGroup = new THREE.Group();
scene.add(flipGroup);

const img = new Image();
img.onload = () => { buildCoin(img); };
img.onerror = () => { console.error('[coin] logo image failed to load — check CSP img-src for data:.'); };
img.src = LOGO_SRC;

function buildCoin(sourceImg) {
  const SIZE = 1024;

  // Sample the logo's own flat background color so the coin's blue matches
  // it, and — more importantly — cut the raccoon down to just its white
  // silhouette (alpha mask) so we only ever draw the shape, never the
  // image's own background square. That's what still showed a faint edge:
  // WEBP compression leaves tiny per-pixel variation even in a "flat" area,
  // and drawing the square verbatim reproduces that edge. A mask removes it
  // structurally instead of trying to color-match it.
  function sampleCornerColor(img) {
    const c = document.createElement('canvas');
    c.width = 1; c.height = 1;
    const cctx = c.getContext('2d');
    cctx.drawImage(img, 0, 0, 1, 1, 0, 0, 1, 1);
    const d = cctx.getImageData(0, 0, 1, 1).data;
    return `rgb(${d[0]}, ${d[1]}, ${d[2]})`;
  }
  const logoBg = sampleCornerColor(sourceImg);

  function extractRaccoonMask(img) {
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const cctx = c.getContext('2d');
    cctx.drawImage(img, 0, 0);
    const id = cctx.getImageData(0, 0, c.width, c.height);
    const d = id.data;
    const bgLum = 60, fgLum = 255; // measured: bg ~60, raccoon white ~255
    for (let i = 0; i < d.length; i += 4) {
      const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      let a = (lum - bgLum) / (fgLum - bgLum);
      a = Math.max(0, Math.min(1, a));
      d[i] = 255; d[i + 1] = 255; d[i + 2] = 255;
      d[i + 3] = Math.round(a * 255);
    }
    cctx.putImageData(id, 0, 0);
    return c;
  }
  const raccoonMask = extractRaccoonMask(sourceImg);

  function makeFaceCanvas() {
    const cv = document.createElement('canvas');
    cv.width = SIZE; cv.height = SIZE;
    const ctx = cv.getContext('2d');
    const cx = SIZE / 2, cy = SIZE / 2, R = SIZE / 2;

    ctx.fillStyle = logoBg;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.translate(cx, cy);

    const beadCount = 72;
    const beadR = R * 0.94;
    for (let i = 0; i < beadCount; i++) {
      const a = (i / beadCount) * Math.PI * 2;
      ctx.save();
      ctx.rotate(a);
      ctx.fillStyle = '#f0f1ff';
      ctx.beginPath();
      ctx.ellipse(0, -beadR, R * 0.015, R * 0.021, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    const flutes = 120;
    const flR1 = R * 0.80, flR2 = R * 0.885;
    ctx.strokeStyle = '#f0f1ff';
    ctx.lineWidth = R * 0.0065;
    for (let i = 0; i < flutes; i++) {
      const a = (i / flutes) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.sin(a) * flR1, -Math.cos(a) * flR1);
      ctx.lineTo(Math.sin(a) * flR2, -Math.cos(a) * flR2);
      ctx.stroke();
    }
    ctx.restore();

    ctx.fillStyle = logoBg;
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.76, 0, Math.PI * 2); ctx.fill();

    const logoScale = 0.78;
    const logoSize = R * 0.76 * 2 * logoScale;
    // LOGO_ROTATION compensates the 90° twist introduced by mesh.rotation.x
    // (the coin is turned to face the camera, which rotates the cylinder's
    // cap UVs relative to the screen). If the raccoon's face still looks
    // off after this, flip the sign to Math.PI / 2.
    const LOGO_ROTATION = -Math.PI / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(LOGO_ROTATION);
    ctx.translate(-cx, -cy);
    // raccoonMask has a transparent background — nothing but the white
    // shape is drawn, so there's no square edge to show at any angle.
    ctx.drawImage(raccoonMask, cx - logoSize / 2, cy - logoSize / 2, logoSize, logoSize);
    ctx.restore();

    return cv;
  }

  const colorCanvas = makeFaceCanvas();

  function makeBumpCanvas(srcCanvas) {
    const cv = document.createElement('canvas');
    cv.width = srcCanvas.width; cv.height = srcCanvas.height;
    const ctx = cv.getContext('2d');
    ctx.drawImage(srcCanvas, 0, 0);
    const id = ctx.getImageData(0, 0, cv.width, cv.height);
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      d[i] = d[i + 1] = d[i + 2] = lum;
    }
    ctx.putImageData(id, 0, 0);
    return cv;
  }
  const bumpCanvas = makeBumpCanvas(colorCanvas);

  const colorTex = new THREE.CanvasTexture(colorCanvas);
  colorTex.encoding = THREE.sRGBEncoding;
  colorTex.anisotropy = 8;
  const bumpTex = new THREE.CanvasTexture(bumpCanvas);
  bumpTex.anisotropy = 8;

  function makeEdgeCanvas() {
    const w = 1024, h = 128;
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#2a3172';
    ctx.fillRect(0, 0, w, h);
    const stripes = 90;
    const sw = w / stripes;
    for (let i = 0; i < stripes; i++) {
      const x = i * sw;
      const g = ctx.createLinearGradient(x, 0, x + sw, 0);
      g.addColorStop(0, '#171c47');
      g.addColorStop(0.5, '#f2f3ff');
      g.addColorStop(1, '#171c47');
      ctx.fillStyle = g;
      ctx.fillRect(x, 0, sw, h);
    }
    return cv;
  }
  const edgeCanvas = makeEdgeCanvas();
  const edgeColorTex = new THREE.CanvasTexture(edgeCanvas);
  edgeColorTex.wrapS = THREE.RepeatWrapping;
  edgeColorTex.encoding = THREE.sRGBEncoding;
  const edgeBumpTex = new THREE.CanvasTexture(edgeCanvas);
  edgeBumpTex.wrapS = THREE.RepeatWrapping;

  const faceMat = new THREE.MeshPhysicalMaterial({
    map: colorTex,
    bumpMap: bumpTex,
    bumpScale: 0.035,
    color: 0xffffff,
    metalness: 0.25,
    roughness: 0.16,
    clearcoat: 1,
    clearcoatRoughness: 0.08,
    envMapIntensity: 1.6,
    emissive: 0x14163a,
    emissiveIntensity: 0.35,
  });
  const faceMatBack = faceMat.clone();

  const edgeMat = new THREE.MeshPhysicalMaterial({
    map: edgeColorTex,
    bumpMap: edgeBumpTex,
    bumpScale: 0.04,
    color: 0xffffff,
    metalness: 0.3,
    roughness: 0.2,
    clearcoat: 1,
    clearcoatRoughness: 0.1,
    envMapIntensity: 1.6,
    emissive: 0x14163a,
    emissiveIntensity: 0.35,
  });

  const geo = new THREE.CylinderGeometry(COIN_R, COIN_R, 0.42, 160, 1, false);
  const mesh = new THREE.Mesh(geo, [edgeMat, faceMat, faceMatBack]);

  // the cylinder's round faces point along its local Y by default (that's
  // the axis through the CENTER of the circle). Rotating 90° around X turns
  // the coin to face the camera along Z instead — now the remaining free
  // vertical axis (world Y, animated below) runs through the RIM, exactly
  // the axis the user asked for.
  mesh.rotation.x = Math.PI / 2;

  flipGroup.add(mesh);
}

function animate() {
  requestAnimationFrame(animate);
  flipGroup.rotation.y += 0.01;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  fitCamera();
  renderer.setSize(stage.clientWidth, stage.clientHeight);
});
})();
}
