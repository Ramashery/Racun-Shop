name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate static site
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BASE_URL: "https://rakun-official.com"
        run: python generate_site.py

      - name: Force Clean URLs (Rename Structure)
        run: |
          cd public
          touch .nojekyll
          
          # Находим все index.html во вложенных папках
          # Пример: en/products/gel/index.html -> переименовываем в en/products/gel.html
          find . -name "index.html" -type f | while read f; do
            if [ "$f" != "./index.html" ]; then
              # Определяем путь без /index.html
              base="${f%/index.html}"
              # Переименовываем папку во флаг .html
              mv "$f" "${base}.html"
            fi
          done

          # Удаляем теперь уже пустые директории, чтобы GitHub не считал их папками
          find . -type d -empty -delete || true

          # Исправляем 404
          if [ -d 404 ]; then
            mv 404/index.html ./404.html || true
            rmdir 404 || true
          fi

          # Копируем админку
          cp ../admin-content.html ./admin-content.html || true
          cp ../admin-pages.html ./admin-pages.html || true
          cp ../admin.js ./admin.js || true
          cp ../admin.css ./admin.css || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
