name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate static site
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BASE_URL: "https://rakun-official.com"
        run: python generate_site.py

      # ЭТОТ ШАГ РЕШАЕТ ПРОБЛЕМУ 404 И СТРУКТУРЫ
      - name: Fix for GitHub Pages
        run: |
          # 1. Говорим GitHub не игнорировать папки с нижним подчеркиванием
          touch public/.nojekyll
          # 2. GitHub требует, чтобы файл 404 лежал в корне, а не в папке 404/index.html
          if [ -f public/404/index.html ]; then
            cp public/404/index.html public/404.html
          fi
          # 3. Если админка лежит в папке admin/index.html, GitHub её найдет.
          # Но если вы заходите на /admin (без слеша), GitHub выдаст 404.
          # Создадим копию для корня, если нужно:
          cp admin-content.html public/admin-content.html || true
          cp admin-pages.html public/admin-pages.html || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public' # Указываем папку public, как в firebase.json

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
