name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate static site
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BASE_URL: "https://rakun-official.com"
        run: python generate_site.py

      - name: Flatten Structure for Clean URLs (No Trailing Slashes)
        run: |
          cd public
          touch .nojekyll
          
          # Переносим все вложенные index.html на уровень выше с названием папки
          # Пример: en/index.html -> en.html, en/catalog/index.html -> en/catalog.html
          find . -name "index.html" -type f ! -path "./index.html" | while read f; do
            target="${f%/index.html}.html"
            mv "$f" "$target"
          done

          # Удаляем теперь уже пустые папки
          find . -type d -empty -delete

          # Исправляем 404.html (должен быть в корне)
          if [ -f 404.html ]; then
             echo "404 is already in root"
          elif [ -f 404/index.html ] || [ -f 404.html ]; then
             mv 404.html 404_tmp.html || true
             mv 404/index.html 404.html || true
             rmdir 404 || true
          fi

          # Копируем админку для прямого доступа без слэша
          cp ../admin-content.html ./admin-content.html || true
          cp ../admin-pages.html ./admin-pages.html || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
