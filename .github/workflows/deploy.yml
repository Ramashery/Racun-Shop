name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate static site
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BASE_URL: "https://rakun-official.com"
        run: python generate_site.py

      - name: Clean URLs Fix (Remove Trailing Slashes)
        run: |
          cd public
          # Создаем .nojekyll
          touch .nojekyll
          
          # Переименовываем папка/index.html в папка.html
          # Это позволит GitHub Pages открывать /about вместо /about/
          find . -name "index.html" | while read f; do
            # Не трогаем главные страницы языковых разделов (en/index.html и т.д.)
            if [[ "$f" == "./en/index.html" || "$f" == "./ru/index.html" || "$f" == "./ka/index.html" || "$f" == "./hy/index.html" || "$f" == "./index.html" ]]; then
              continue
            fi
            
            dir=$(dirname "$f")
            mv "$f" "$dir.html"
            rmdir "$dir"
          done

          # Исправляем 404 ошибку
          if [ -f 404/index.html ]; then
            mv 404/index.html 404.html
            rmdir 404
          fi

          # Копируем админку в корень для прямого доступа
          cp ../admin-content.html ./admin-content.html || true
          cp ../admin-pages.html ./admin-pages.html || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
