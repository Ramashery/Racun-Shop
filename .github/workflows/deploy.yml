name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate static site
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BASE_URL: "https://rakun-official.com"
        run: python generate_site.py

      - name: Prepare structure for GitHub Pages
        run: |
          # Заходим в папку с собранным сайтом
          cd public
          
          # 1. Создаем .nojekyll (обязательно)
          touch .nojekyll
          
          # 2. Делаем копии для Clean URLs (чтобы работало без слэша)
          # Было: en/index.html -> Станет: en.html (откроется как /en)
          # Было: en/catalog/index.html -> Станет: en/catalog.html (откроется как /en/catalog)
          find . -name "index.html" -type f | while read f; do
            if [ "$f" != "./index.html" ]; then
              cp "$f" "${f%/index.html}.html"
            fi
          done

          # 3. Исправляем 404 ошибку (GitHub ждет 404.html в корне)
          if [ -f 404/index.html ]; then
            cp 404/index.html 404.html
          fi

          # 4. Копируем файлы админки из корня репозитория в папку сборки
          cp ../admin-content.html ./admin-content.html || true
          cp ../admin-pages.html ./admin-pages.html || true
          cp ../admin.js ./admin.js || true
          cp ../admin.css ./admin.css || true
          
          # Проверка для логов (увидим, какие файлы в итоге загружаются)
          ls -R

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
